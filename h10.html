<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">
    <title>Palvelinten hallinta-tehtävät</title>
    <style>
        
        :root       { color-scheme: light dark; }

        body        { font-family: arial, verdana, sans-serif; line-height: 1.4; max-width: 1100px; margin: 0 auto; padding: 0 10px; overflow-wrap: anywhere; }

        h1, h2, h3, ul, p { text-align: center; }
        p, ul       { margin: 20px 0; }
        h1 + h2     { border-top: none; padding-top: 0;}
                
        ul          { list-style-position: inside; display: flex; flex-direction: column; gap: 20px; }
        h1          { font-size: 250%; margin: 50px 0; padding-bottom: 10px; border-bottom: 2px solid; }
        h2          { font-size: 150%; margin: 40px 0 20px; padding-top: 30px; border-top: 3px solid gray; }
        h3          { font-size: 120%; margin: 40px 0 30px; }
        
        code        { font-family: monospace; background: rgba(128, 128, 128, 0.2); padding: 1px 5px; border-radius: 3px; }

        .hostit     { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .host       { border: 2px solid #999; border-radius: 8px; padding: 8px 14px; text-align: center; }
        .host h3    { margin-top: 0; }
        .host ul    { list-style: none; padding: 0; margin: 0; }

        .kuvat-contti { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 25px; margin: 40px auto; }
        .kuvat { width: auto; max-width: min(500px, 100%); height: auto; }

        @media (prefers-color-scheme: dark) { .kuvat { filter: brightness(0.9); } }
        
    </style>
</head>

<body>

    <h1>Harjoitus 10: postgre</h1>

        <div class="kuvat-contti">
            <img src="Kuvat/h10_postgresql_0.png" class="kuvat" alt="kuva"> 
        </div>

        <p>Linkki dump-tiedostoon Githubissa: <a href="https://github.com/piiponen/palvelinhallinta/blob/main/test.sql">Linkki</a></p>
        
</body>

</html>
